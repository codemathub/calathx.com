version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: calathx-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: calathx-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/calathx
    depends_on:
      - mongodb

  client:
    build: ./client
    container_name: calathx-client
    restart: unless-stopped
    ports:
      - '5173:5173'
    depends_on:
      - server

volumes:
  mongo_data:

